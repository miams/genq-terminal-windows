name: Build GenQuery Terminal

on:
  push:
    branches: [genq, main]
  pull_request:
    branches: [genq, main]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build (x64 Release)
    # windows-2022 is pinned intentionally: it ships with Windows SDK 10.0.22621.0
    # pre-installed. windows-latest (windows-2025) has a newer SDK but not 22621,
    # and vs_installer.exe modify runs asynchronously so can't be used to install
    # it reliably before the build starts.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 8.x required for net8.0-windows projects (WpfTerminalControl etc.)
          # 9.x required by WpfTerminalControl's net472 TFM restore and build tooling
          dotnet-version: |
            8.x
            9.x

      - name: Restore SDK-style projects
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj
          dotnet restore src\tools\GraphemeTableGen\GraphemeTableGen.csproj
          dotnet restore src\tools\GraphemeTestTableGen\GraphemeTestTableGen.csproj

      - name: Build
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQueryTerminal-x64-Release
          path: bin\x64\Release\
          if-no-files-found: error
