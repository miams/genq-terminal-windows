name: Build GenQuery Terminal

on:
  push:
    branches: [genq, main]
  pull_request:
    branches: [genq, main]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows SDK 10.0.22621.0
        run: |
          $vsInstaller = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
          & $vsInstaller modify `
            --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' `
            --add Microsoft.VisualStudio.Component.Windows11SDK.22621 `
            --quiet --norestart --force
          # vs_installer exits non-zero on warnings; suppress to avoid failing the step
          exit 0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore SDK-style projects
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj

      - name: Build
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQueryTerminal-x64-Release
          path: bin\x64\Release\
          if-no-files-found: error
