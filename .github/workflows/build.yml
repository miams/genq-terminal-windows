name: Build GenQuery Terminal

on:
  push:
    branches: [genq, main]
  pull_request:
    branches: [genq, main]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build (x64 Release)
    # windows-2022 is pinned intentionally: it ships with Windows SDK 10.0.22621.0
    # pre-installed. windows-latest (windows-2025) has a newer SDK but not 22621,
    # and vs_installer.exe modify runs asynchronously so can't be used to install
    # it reliably before the build starts.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore SDK-style projects
        run: |
          # -r win-x64 tells dotnet which platform to target, so it resolves
          # Microsoft.Windows.SDK.NET.Ref (needed for net8.0-windows at build time).
          # --no-self-contained prevents self-contained mode, which would try to download
          # Microsoft.NETCore.App.Runtime.win-x64 — absent from TerminalDependencies feed (NU1102).
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj -r win-x64 --no-self-contained
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj -r win-x64 --no-self-contained
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj -r win-x64 --no-self-contained
          dotnet restore src\tools\GraphemeTableGen\GraphemeTableGen.csproj
          dotnet restore src\tools\GraphemeTestTableGen\GraphemeTestTableGen.csproj

      - name: Build
        run: |
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQueryTerminal-x64-Release
          path: bin\x64\Release\
          if-no-files-found: error
